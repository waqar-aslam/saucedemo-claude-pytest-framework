[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --tracing=retain-on-failure --screenshot=only-on-failure --output=reports/artifacts
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-7s %(name)s: %(message)s
markers =
    smoke: quick sanity checks
    e2e: full end-to-end customer journey
    negative: invalid input / error handling scenarios
